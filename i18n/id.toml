# nuno — English UI strings.
#
# Copy this file to i18n/<lang>.toml in your own site (or in the theme, as a
# pull request) and translate the values. Keys with `one` and `other` are
# pluralised by Hugo from the `count` passed in; `{{ .count }}` and friends are
# Go template placeholders and must survive translation.
#
# Nothing here is content — post titles, section titles and page headings all
# come from your front matter. These are only the strings the theme itself
# renders.

[masthead]
other = "Hai. <br><span class=\"accent\">Saya Fahrel.</span>"

[tagline]
other = "Ringkasan singkat tentang situs ini"

# --- Chrome: nav, footer, skip link -----------------------------------------

[skipToContent]
other = "Lewati ke konten"
 
[searchPosts]
other = "Cari tulisan"
 
[search]
other = "Cari"
 
[switchColourTheme]
other = "Ganti tema warna"
 
# Announced by the theme toggle. The label describes where the button goes,
# not where you are, so it is the opposite of the current mode.
[switchToLight]
other = "Ganti ke mode terang"
 
[switchToDark]
other = "Ganti ke mode gelap"
 
[switchToGreen]
other = "Ganti ke hijau"
 
[switchToBrown]
other = "Ganti ke cokelat"
 
[opensInNewTab]
other = "(terbuka di tab baru)"
 
# --- Search overlay ---------------------------------------------------------
 
[searchPlaceholder]
other = "Cari"
 
[searchEsc]
other = "Esc"
 
[searchCancel]
other = "Batal"
 
[searchHintMove]
other = "↑↓ pindah"
 
[searchHintOpen]
other = "↵ buka"
 
[searchHintClose]
other = "esc tutup"
 
# Rendered as: Belum ada tulisan tentang <the query>.
[searchEmptyTitle]
other = "Belum ada tulisan tentang"
 
[searchEmptyHint]
other = "Coba kata yang lebih pendek, atau ejaan yang berbeda."
 
# Indonesian has no singular/plural distinction, so only `other` is needed.
[searchBrowseAll]
other = "Lihat semua {{ .count }} tulisan →"
 
# Result count above the list. Rendered by JavaScript, which cannot call i18n.
# Keep the `{n}` literal.
[resultsCountOne]
other = "{n} tulisan"
 
[resultsCountMany]
other = "{n} tulisan"
 
# The /search/ page. `{{ .key }}` is the ⌘K / Ctrl K badge and is HTML.
[searchPageLead]
other = "Cari di {{ .count }} tulisan berdasarkan judul, deskripsi, atau tag."
 
[searchPageHint]
other = "Tekan {{ .key }} di mana saja pada situs ini untuk membukanya."
 
